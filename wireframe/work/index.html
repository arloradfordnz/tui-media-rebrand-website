<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- UNLISTED ON PURPOSE.
     Nothing on tuimedia.nz links here. This page exists to be pasted into a
     message to one person — "here is the work" — and nowhere else, so it is
     kept out of the nav, out of sitemap.xml, and out of the index by the
     noindex below and the matching X-Robots-Tag in vercel.json. Neither of
     those is a lock: the URL is public to anyone who has it. It is a page
     you hand out, not a page you hide. -->
<meta name="robots" content="noindex, nofollow, noarchive">

<title>Work — Tui Media</title>
<meta name="description" content="Video ads Tui Media has made for New Zealand businesses.">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="icon" href="/favicon-512.png" sizes="512x512">
<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>

<style>
  /* The site's font and palette, lifted from index.html rather than shared —
     there is no build step here, and a second page is not worth inventing one
     for. If the tokens there change, they change here too. */
  @font-face {
    font-family: 'Bricolage Grotesque';
    font-style: normal;
    font-weight: 200 800;
    font-stretch: 100%;
    font-display: swap;
    src: url(/fonts/bricolage-grotesque-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --paper:    #060D1A;
    --surface:  #0F1930;
    --ink:      #EFF2F8;
    --muted:    #8996B2;
    --rule:     rgba(239, 242, 248, 0.13);
    --rule-2:   rgba(239, 242, 248, 0.26);
    --accent:      #6E9BF7;
    --accent-ink:  #0A1428;
    --accent-soft: rgba(110, 155, 247, 0.16);
    --slot-1: #111B33;

    /* nav pill: translucent so content reads through it while it floats */
    --nav-bg: rgba(15, 25, 48, 0.40);
    --nav-h: 60px;
    --logo-bird: url("/img/tui-bird.webp");

    --t-h2:    clamp(2rem, 5.2vw, 3.75rem);
    --t-body:  clamp(1rem, 1.15vw, 1.125rem);
    --t-small: 0.8125rem;
    --t-micro: 0.75rem;

    --s-1: 0.5rem;
    --s-2: 1rem;
    --s-3: 1.5rem;
    --s-4: 2rem;
    --s-5: 3rem;
    --s-6: 4.5rem;

    --frame: clamp(0.75rem, 1.4vw, 1.25rem);
    --content: 1120px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --radius-sm:   22px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: var(--t-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  :focus:not(:focus-visible) { outline: none; }

  .wrap {
    max-width: var(--content);
    margin: 0 auto;
    padding-inline: var(--frame);
  }

  /* ---------- nav ----------
     The site's nav, not an approximation of it: same pill, same glass, same
     wordmark, same label-swap on the links, same CTA. The only difference is
     that the destinations are absolute (/#fit rather than #fit) because they
     live on the home page, not this one. index.html's own click handler only
     intercepts href="#..." so these stay plain navigations, and the router
     there already handles arriving on #book, while everything else is an
     ordinary anchor the browser lands on itself. */
  .nav-wrap {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: var(--frame);
  }
  .nav {
    position: relative;
    max-width: calc(var(--content) - 2 * var(--frame));
    margin-inline: auto;
    height: var(--nav-h);
    padding: 6px 6px 6px var(--s-4);
    border-radius: var(--radius-pill);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: var(--s-4);

    background: var(--nav-bg);
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    border: 0;
    box-shadow: 0 10px 34px -10px rgba(0, 0, 0, 0.6);
  }
  .nav { backdrop-filter: blur(30px) saturate(190%); }

  .wordmark {
    display: inline-flex; align-items: center; line-height: 0;
    min-width: 44px; min-height: 44px;
    margin-left: -10px; padding-left: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  .wordmark i {
    display: block;
    height: 40px;
    width: 24px;                        /* artwork is 0.598:1 */
    background: var(--logo-bird) no-repeat center / contain;
  }

  .nav-links {
    display: flex;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    gap: var(--s-4);
    font-size: 0.9375rem;
    font-weight: 500;
  }
  .nav-links a { color: var(--muted); text-decoration: none; white-space: nowrap; }
  .nav-links .nav-label { display: inline-grid; overflow: hidden; line-height: 1.3; }
  .nav-links .nav-label > span {
    grid-area: 1 / 1;
    transition: transform 380ms var(--ease-out), color 200ms ease;
  }
  .nav-links .nav-label > span:nth-child(2) { transform: translateY(115%); }
  @media (hover: hover) and (pointer: fine) {
    .nav-links a:hover .nav-label > span:nth-child(1) { transform: translateY(-115%); color: var(--ink); }
    .nav-links a:hover .nav-label > span:nth-child(2) { transform: translateY(0); color: var(--ink); }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.7em;
    height: 44px;
    padding: 6px 6px 6px 1.15rem;
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.9375rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
    border: 1px solid transparent;
    white-space: nowrap;
    cursor: pointer;
    transition: transform 140ms var(--ease-out);
  }
  .btn:active { transform: scale(0.975); }
  .nav .btn { margin-left: auto; }
  .btn-label { display: grid; overflow: hidden; line-height: 1.25; }
  .btn-label > span {
    grid-area: 1 / 1;
    transition: transform 460ms cubic-bezier(.19, 1, .22, 1);
  }
  .btn-label > span:nth-child(2) { transform: translateY(115%); }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover .btn-label > span:nth-child(1) { transform: translateY(-115%); }
    .btn:hover .btn-label > span:nth-child(2) { transform: translateY(0); }
  }
  .btn .arrow {
    width: 30px; height: 30px;
    flex: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent-ink);
    color: var(--accent);
    overflow: hidden;
    position: relative;
  }
  .btn .arrow svg {
    grid-area: 1 / 1;
    width: 12px; height: 12px;
    display: block;
    transition: transform 420ms cubic-bezier(.19, 1, .22, 1);
  }
  .btn .arrow svg:nth-child(2) { transform: translateX(-160%); }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover .arrow svg:nth-child(1) { transform: translateX(160%); }
    .btn:hover .arrow svg:nth-child(2) { transform: translateX(0); }
  }

  /* The page has no visible heading: it is a grid of clips and nothing else,
     which is the whole brief. The h1 stays for anything reading the document
     rather than looking at it. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ---------- grid ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: var(--s-3);
    padding-block: var(--s-4) var(--s-6);
  }

  /* A card is a button, not a div with a click handler: this page is sent to
     people who may well open it on a phone or drive it from the keyboard, and
     play/pause is exactly what a button is for. */
  .card {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;

    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16;
    /* No resting border. A hairline of rgba(255,255,255,.13) reads as a pale
       edge on every card, and worst on the corners where the radius stretches
       it along the curve. The clip should meet the page directly. */
    border: 0;
    border-radius: var(--radius-sm);
    background: var(--slot-1) center / cover no-repeat;
    overflow: hidden;
    isolation: isolate;   /* same reason as the home page: Safari will paint a
                             <video> over its siblings unless the card owns its
                             own stacking context */
    transition: box-shadow 260ms var(--ease-out);
  }
  /* The one card playing out loud, and only on click. A ring rather than a
     border: box-shadow paints outside the box, so nothing about the card's
     size or the video inside it changes when it turns on. */
  .card.is-sound { box-shadow: 0 0 0 2px var(--accent); }

  .card video {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    /* Transparent, not var(--slot-1): the card's own background-image (set in
       JS, from the same poster the video carries) is what shows through here
       before a frame has decoded. Painting a solid colour on the video itself
       was the flash on hover — the poster attribute stops covering the
       element the moment play() is called, and playback has no frame ready
       yet, so the video's own background showed through for a beat. */
    background: transparent;
  }

  /* name and trade, over a scrim so they stay legible whatever the clip does */
  .meta {
    position: absolute;
    left: 0; right: 0; top: 0;
    z-index: 2;
    transform: translateZ(0);
    padding: var(--s-2) var(--s-3) var(--s-4);
    display: grid;
    gap: 2px;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.62), transparent);
    pointer-events: none;
  }
  .meta .name {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.9375rem; font-weight: 500; letter-spacing: -0.02em; color: #fff;
  }
  .meta .tick { width: 13px; height: 13px; flex: none; }
  .meta .trade { font-size: var(--t-small); color: rgba(255, 255, 255, 0.72); }

  /* ---------- the play / sound affordance ----------
     One control in the bottom-left that says what the card is doing: a play
     triangle at rest, bars while it is playing with sound. It is the only
     thing on the card that changes on click, so it carries the state.
     Same material as the nav pill — blur plus saturation, not a flat tint —
     so the control reads as glass sitting on the clip rather than a sticker
     laid over it. */
  .state {
    position: absolute;
    left: var(--s-2); bottom: var(--s-2);
    z-index: 2;
    transform: translateZ(0);
    display: inline-flex; align-items: center;
    width: 30px; height: 30px;
    justify-content: center;
    border-radius: 50%;
    background: var(--nav-bg);
    -webkit-backdrop-filter: blur(20px) saturate(190%);
    box-shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.6);
    color: #fff;
    pointer-events: none;
    transition: background 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
  }
  /* Lightning CSS folds two backdrop-filter declarations in one rule into
     one — the standard property gets its own rule for that reason. */
  .state { backdrop-filter: blur(20px) saturate(190%); }
  .card.is-sound .state {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .state svg { width: 13px; height: 13px; flex: none; display: block; }
  .state .off { margin-left: 1px; }  /* the triangle's own weight sits left of centre; nudge it back */
  .state .on  { display: none; }
  .card.is-sound .state .off { display: none; }
  .card.is-sound .state .on  { display: block; }

  /* Muted hover preview gets its own quiet marker in the opposite corner, so
     "moving but silent" never reads as "playing". */
  .silent {
    position: absolute;
    right: var(--s-2); bottom: var(--s-2);
    z-index: 2;
    transform: translateZ(0);
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    background: rgba(6, 13, 26, 0.72);
    color: rgba(255, 255, 255, 0.8);
    font-size: var(--t-micro);
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms var(--ease-out);
  }
  .card.is-preview .silent { opacity: 1; }
  .card.is-sound .silent { opacity: 0 !important; }

  footer {
    border-top: 1px solid var(--rule);
    padding-block: var(--s-4) var(--s-6);
    color: var(--muted);
    font-size: var(--t-small);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: var(--s-2) var(--s-4);
    align-items: baseline;
  }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule-2); }
  footer a:hover { border-bottom-color: var(--accent); }

  /* Same breakpoints the nav uses on the home page, so the pill behaves
     identically on both: tighter at 900, and on a phone the links drop out
     entirely and the mark shrinks, leaving the mark and the one action. */
  @media (max-width: 900px) {
    .nav { gap: var(--s-2); padding-left: var(--s-3); }
    .nav-links { gap: var(--s-3); font-size: 0.8125rem; }
  }

  @media (max-width: 620px) {
    :root { --nav-h: 56px; }
    .nav { height: 56px; padding-left: var(--s-3); }
    .wordmark i { height: 32px; width: 19px; }
    .nav-links { display: none; }
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s-2); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

  <h1 class="sr-only">Work</h1>

  <!-- Cards carry their clip on data-src rather than src: with no src there is
       no request at all until the first play, so opening the page costs the
       posters and nothing else. -->
  <div class="grid" id="grid"></div>

  <footer>

<script>
(function () {
  'use strict';

  /* Newest first, then spread so the same business never sits in two cards
     running next to each other — three Sky Automotive clips and three
     Johnson Residential clips is most of the grid, and grouped they read as
     "here is one client's reel" rather than "here is the work". Round-robin
     across businesses, most clips first, keeps the newest clip in the lead
     slot and still lands with no two neighbours the same. */
  var WORK = [
    { slug: 'sky-automotive-3',      name: 'Sky Automotive',         trade: 'New location' },
    { slug: 'johnson-residential-3', name: 'Johnson Residential',    trade: 'Residential building' },
    { slug: 'nelson-city-framers-1', name: 'Nelson City Framers',    trade: 'Framing and construction' },
    { slug: 'atk-detailing',         name: 'ATK Detailing',          trade: 'Car detailing' },
    { slug: 'washrite',              name: 'Washrite',               trade: 'Exterior cleaning' },
    { slug: 'nelson-english-center', name: 'Nelson English Center',  trade: 'English language school' },
    { slug: 'sky-automotive-1',      name: 'Sky Automotive',         trade: 'Automotive servicing' },
    { slug: 'johnson-residential-1', name: 'Johnson Residential',    trade: 'Residential building' },
    { slug: 'nelson-city-framers-2', name: 'Nelson City Framers',    trade: 'Framing and construction' },
    { slug: 'sky-automotive-2',      name: 'Sky Automotive',         trade: 'Automotive servicing' },
    { slug: 'johnson-residential-2', name: 'Johnson Residential',    trade: 'Residential building' }
  ];

  var PLAY_ICON = '<svg class="off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>'
                + '<svg class="on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4.5" width="4" height="15" rx="1.4"/><rect x="14.5" y="4.5" width="4" height="15" rx="1.4"/></svg>';

  function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var grid = document.getElementById('grid');
  var html = WORK.map(function (w) {
    return '<button class="card" type="button" data-slug="' + esc(w.slug) + '"'
         + ' style="background-image:url(/media/work/' + esc(w.slug) + '-poster.webp)"'
         + ' aria-label="Play ' + esc(w.name) + ', ' + esc(w.trade) + ', with sound">'
         + '<video playsinline loop preload="none" muted'
         + ' poster="/media/work/' + esc(w.slug) + '-poster.webp"'
         + ' data-src="/media/work/' + esc(w.slug) + '.mp4"></video>'
         + '<span class="meta">'
         +   '<span class="name">' + esc(w.name) + '<svg class="tick" aria-label="Meta verified"><use href="#tick"></use></svg></span>'
         +   '<span class="trade">' + esc(w.trade) + '</span>'
         + '</span>'
         + '<span class="state">' + PLAY_ICON + '</span>'
         + '<span class="silent">Muted preview</span>'
         + '</button>';
  }).join('');
  grid.innerHTML = html;

  var cards = [].slice.call(grid.querySelectorAll('.card'));
  /* The one card playing out loud. Only ever one — a grid of eleven clips all
     talking over each other is the failure mode this page exists to avoid. */
  var sound = null;

  function video(card) { return card.querySelector('video'); }

  /* Nothing has a src until it is first asked to play, so the page itself
     downloads only the posters. */
  function load(v) {
    if (!v.src) v.src = v.getAttribute('data-src');
  }

  function stop(card) {
    if (!card) return;
    var v = video(card);
    release(v);
    v.muted = true;
    card.classList.remove('is-sound', 'is-preview');
  }

  function preview(card) {
    /* Silent, so it needs no gesture and cannot interrupt the card that is
       actually playing out loud. */
    if (sound) return;
    var v = video(card);
    load(v);
    v.muted = true;
    card.classList.add('is-preview');
    var p = v.play();
    if (p) p.catch(function () { card.classList.remove('is-preview'); });
  }

  /* Pausing a video does NOT stop it downloading, and that was the whole
     problem here. One sweep of the mouse across the grid armed all eleven
     clips, and every one of them carried on pulling its file down in the
     background: measured at ~16MB fetched from a single pass, eleven
     transfers competing for the same connection and eleven decoders held
     open. The clip you actually wanted to watch was queued behind the ten
     you did not, which is what "laggy" and "not working" looked like.
     Clearing the source and reloading is what actually cancels the
     transfer and hands the decoder back. The card keeps its poster as a
     background image, so dropping the video changes nothing on screen. */
  function release(v) {
    v.pause();
    if (!v.src) return;
    v.removeAttribute('src');
    /* Without the reload the element keeps the old buffer and the request
       alive; with it, the fetch is aborted. */
    try { v.load(); } catch (err) {}
  }

  function endPreview(card) {
    if (card === sound) return;
    release(video(card));
    card.classList.remove('is-preview');
  }

  function withSound(card) {
    if (sound && sound !== card) stop(sound);
    var v = video(card);
    load(v);
    card.classList.remove('is-preview');
    card.classList.add('is-sound');
    sound = card;
    /* Unmuting inside the click handler is what makes this allowed: the
       gesture is still on the stack, so the autoplay policy lets the sound
       through. Unmuting later — on canplay, say — does not get that. */
    v.muted = false;
    v.volume = 1;
    var p = v.play();
    if (p) p.catch(function () {
      /* Blocked anyway (an iOS silent switch, a policy this page cannot see).
         Fall back to a silent play rather than a dead card. */
      v.muted = true;
      card.classList.remove('is-sound');
      card.classList.add('is-preview');
      if (sound === card) sound = null;
      v.play().catch(function () {});
    });
  }

  cards.forEach(function (card) {
    var v = video(card);

    card.addEventListener('click', function () {
      if (card === sound) { stop(card); sound = null; return; }
      withSound(card);
    });

    /* Hover previews are gated on a real pointer, so a tap on a phone does
       not fire one on the way to the click. The delay is hover intent: moving
       the pointer to the far side of the grid crosses three or four cards on
       the way, and without it each of those crossings starts a download for
       a clip nobody asked to see. */
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      var dwell = null;
      card.addEventListener('mouseenter', function () {
        clearTimeout(dwell);
        dwell = setTimeout(function () { preview(card); }, 160);
      });
      card.addEventListener('mouseleave', function () {
        clearTimeout(dwell);
        endPreview(card);
      });
    }

    /* Keyboard focus is the other way to arrive at a card, and it should
       behave like hover does: a look, not a commitment. */
    card.addEventListener('focus', function () { preview(card); });
    card.addEventListener('blur', function () { endPreview(card); });
  });

  /* Leaving the tab kills the sound; nobody wants a page they switched away
     from still talking. */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    cards.forEach(function (c) { if (c !== sound) endPreview(c); });
    if (sound) { video(sound).pause(); }
  });

  /* Escape stops whatever is playing out loud. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !sound) return;
    stop(sound);
    sound = null;
  });
})();
</script>

</body>
</html>
